name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: barber
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/barber?schema=public
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_TIMEZONE: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Popular banco (seed)
        run: npx prisma db seed

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes de ponta a ponta
        run: |
          npm run start &
          npx --yes wait-on@8 -t 60000 http://localhost:3000/api/health
          bash scripts/smoke-test.sh
