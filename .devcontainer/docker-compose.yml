services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-20-bookworm
    volumes:
      - ..:/workspaces/barber-system:cached
    command: sleep infinity
    network_mode: service:db
    environment:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/barber?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:password@localhost:5432/barber?schema=public
      NEXTAUTH_SECRET: codespaces-dev-secret
      NEXT_PUBLIC_TIMEZONE: America/Sao_Paulo

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: barber
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
